name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin

          - platform: darwin-x64
            os: macos-latest
            target: x86_64-apple-darwin

          - platform: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use-cross: true

          - platform: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use-cross: true

          - platform: win32-x64
            os: windows-latest
            target: x86_64-pc-windows-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for ARM Linux)
        if: matrix.use-cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary
        working-directory: app/backend
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Prepare binary
        working-directory: app/backend
        run: |
          mkdir -p ../npm/${{ matrix.platform }}
          if [ "${{ matrix.platform }}" = "win32-x64" ]; then
            cp target/${{ matrix.target }}/release/fuzzy-img-viewer-backend.exe ../npm/${{ matrix.platform }}/
          else
            cp target/${{ matrix.target }}/release/fuzzy-img-viewer-backend ../npm/${{ matrix.platform }}/
          fi
        shell: bash

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: app/npm/${{ matrix.platform }}/fuzzy-img-viewer-backend*
          retention-days: 1

  publish-platform-packages:
    name: Publish platform packages
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Copy binaries to platform packages
        run: |
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            cp artifacts/binary-$platform/* app/npm/$platform/ || true
          done

      - name: Publish platform packages
        working-directory: app/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            echo "Publishing @vmasrani/fuzzy-img-viewer-$platform..."
            cd $platform
            npm publish --access public
            cd ..
          done

  publish-main-package:
    name: Publish main package
    needs: publish-platform-packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: Publish main package
        working-directory: app
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

  create-github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            if [ -f "artifacts/binary-$platform/fuzzy-img-viewer-backend" ]; then
              cp "artifacts/binary-$platform/fuzzy-img-viewer-backend" "release-assets/fuzzy-img-viewer-backend-$platform"
            elif [ -f "artifacts/binary-$platform/fuzzy-img-viewer-backend.exe" ]; then
              cp "artifacts/binary-$platform/fuzzy-img-viewer-backend.exe" "release-assets/fuzzy-img-viewer-backend-$platform.exe"
            fi
          done

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
